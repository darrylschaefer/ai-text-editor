<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./fthr-icon.svg" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#08090b" />
    <meta
      name="description"
      content="fthr — A place for your words. A local-first writing workspace with AI tools."
    />
    <meta
      name="twitter:description"
      content="fthr — A place for your words. A local-first writing workspace with AI tools."
    />
    <meta name="twitter:title" content="fthr" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>fthr — A place for your words</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script>
      // Apply theme immediately to prevent flash of light mode
      // This runs before React loads, so we can only check localStorage synchronously
      // The main.tsx will handle reading from IndexedDB for the full state
      (function() {
        // Check localStorage for legacy theme support
        const legacyTheme = localStorage.getItem('theme');
        if (legacyTheme === 'dark' || legacyTheme === 'light') {
          document.documentElement.className = legacyTheme;
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
